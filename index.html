<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise For You</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">


<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255, 105, 145, .22),
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(179, 91, 255, .18),
            transparent 30%
        ),

        #100a12;

    color: white;

    font-family: "Poppins", sans-serif;
}


/* =========================================
   BACKGROUND GLOW
========================================= */

.glow {

    position: fixed;

    width: 400px;
    height: 400px;

    border-radius: 50%;

    background:
        rgba(255, 105, 145, .12);

    filter: blur(100px);

    pointer-events: none;
}

.glow.one {

    top: -180px;
    left: -150px;
}

.glow.two {

    right: -180px;
    bottom: -180px;

    background:
        rgba(170, 90, 255, .12);
}


/* =========================================
   FLOATING EMOJIS
========================================= */

#emojiContainer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;
}


.emoji {

    position: absolute;

    bottom: -60px;

    opacity: 0;

    animation:
        floatEmoji
        linear
        forwards;

    user-select: none;
}


@keyframes floatEmoji {

    0% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(.7);

        opacity: 0;
    }

    15% {
        opacity: .7;
    }

    100% {

        transform:
            translateY(-110vh)
            rotate(25deg)
            scale(1.1);

        opacity: 0;
    }
}


/* =========================================
   MAIN
========================================= */

main {

    position: relative;

    z-index: 2;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


/* =========================================
   CARD
========================================= */

.card {

    width:
        min(
            500px,
            100%
        );

    padding:
        48px 35px;

    text-align: center;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 28px;

    background:
        rgba(255,255,255,.055);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.45);

    animation:
        cardAppear
        1s
        ease;
}


@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(35px)
            scale(.95);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================
   TOP ICON
========================================= */

.icon {

    width: 75px;

    height: 75px;

    margin:
        0 auto 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        rgba(255,143,171,.12);

    border:
        1px solid
        rgba(255,143,171,.25);

    font-size: 34px;

    box-shadow:
        0 0 35px
        rgba(255,105,145,.15);

    animation:
        iconFloat
        2.5s
        ease-in-out
        infinite
        alternate;
}


@keyframes iconFloat {

    to {

        transform:
            translateY(-7px)
            rotate(3deg);
    }
}


/* =========================================
   TEXT
========================================= */

.small-title {

    font-size: 11px;

    letter-spacing: .25em;

    text-transform: uppercase;

    color:
        rgba(255,255,255,.55);

    margin-bottom: 12px;
}


h1 {

    font-family:
        "Caveat",
        cursive;

    font-size:
        clamp(
            55px,
            12vw,
            80px
        );

    font-weight: 500;

    line-height: .85;
}


h1 span {

    display: block;

    color: #ff8fab;

    font-style: italic;
}


.description {

    margin:
        25px auto 30px;

    max-width: 370px;

    color:
        rgba(255,255,255,.65);

    font-size: 14px;

    line-height: 1.7;
}


/* =========================================
   NAME INPUT
========================================= */

.input-wrapper {

    position: relative;

    margin-top: 20px;
}


.input-wrapper input {

    width: 100%;

    height: 58px;

    padding:
        0 20px;

    border-radius: 15px;

    border:
        1px solid
        rgba(255,255,255,.14);

    outline: none;

    background:
        rgba(0,0,0,.2);

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 15px;

    text-align: center;

    transition: .3s;
}


.input-wrapper input::placeholder {

    color:
        rgba(255,255,255,.38);
}


.input-wrapper input:focus {

    border-color:
        rgba(255,143,171,.7);

    box-shadow:
        0 0 25px
        rgba(255,105,145,.12);
}


/* =========================================
   BUTTON
========================================= */

.open-button {

    width: 100%;

    height: 58px;

    margin-top: 14px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #ff8fab,
            #c83d67
        );

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 12px 30px
        rgba(200,61,103,.3);

    transition:
        transform .25s,
        box-shadow .25s;
}


.open-button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 18px 40px
        rgba(200,61,103,.45);
}


.open-button:active {

    transform:
        scale(.98);
}


/* =========================================
   BOTTOM TEXT
========================================= */

.bottom-text {

    margin-top: 24px;

    font-size: 11px;

    color:
        rgba(255,255,255,.38);
}


/* =========================================
   ERROR
========================================= */

.error {

    height: 20px;

    margin-top: 8px;

    font-size: 12px;

    color: #ff8fab;

    opacity: 0;

    transition: .2s;
}


.error.show {
    opacity: 1;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    main {
        padding: 15px;
    }

    .card {

        padding:
            40px 22px;

        border-radius: 24px;
    }

    .icon {

        width: 65px;
        height: 65px;

        font-size: 29px;
    }

    h1 {

        font-size: 57px;
    }

    .description {

        font-size: 13px;

        margin-top: 22px;
    }

}


@media (max-width: 360px) {

    .card {

        padding:
            32px 18px;
    }

    h1 {

        font-size: 50px;
    }

}

</style>

</head>


<body>


<!-- Background -->
<div class="glow one"></div>
<div class="glow two"></div>


<!-- Floating friendship emojis -->
<div id="emojiContainer"></div>


<main>

    <div class="card">


        <!-- Icon -->

        <div class="icon">
            🤝
        </div>


        <!-- Heading -->

        <div class="small-title">
            A little surprise
        </div>


        <h1>

            Something

            <span>
                For You
            </span>

        </h1>


        <p class="description">

            কিছু কথা সরাসরি বলা হয় না।
            তাই একটা ছোট্ট চিঠির মাধ্যমে
            কিছু কথা তোমার সাথে share করতে চাই।

        </p>


        <!-- Name -->

        <div class="input-wrapper">

            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name"
                maxlength="30"
                autocomplete="off"
            >

        </div>


        <div
            id="error"
            class="error"
        >
            Please enter your name
        </div>


        <!-- Button -->

        <button
            id="openButton"
            class="open-button"
        >

            Open Your Letter
            &nbsp; →
            
        </button>


        <p class="bottom-text">

            Made specially for a best friend ✨

        </p>


    </div>

</main>



<script>

/* =========================================
   ELEMENTS
========================================= */

const nameInput =
    document.getElementById(
        "nameInput"
    );


const openButton =
    document.getElementById(
        "openButton"
    );


const error =
    document.getElementById(
        "error"
    );


const emojiContainer =
    document.getElementById(
        "emojiContainer"
    );


/* =========================================
   EMOJI LIST
========================================= */

const emojis = [

    "🤝",
    "⭐",
    "✨",
    "🌟",
    "🎉",
    "😊",
    "🌱",
    "🫶",
    "🎈"

];


/* =========================================
   CREATE EMOJI
========================================= */

function createEmoji() {

    const emoji =
        document.createElement(
            "span"
        );


    emoji.className =
        "emoji";


    emoji.textContent =
        emojis[
            Math.floor(
                Math.random() *
                emojis.length
            )
        ];


    emoji.style.left =
        Math.random() * 100 + "%";


    emoji.style.fontSize =
        (
            15 +
            Math.random() * 18
        ) + "px";


    emoji.style.animationDuration =
        (
            6 +
            Math.random() * 6
        ) + "s";


    emojiContainer.appendChild(
        emoji
    );


    setTimeout(
        () => emoji.remove(),
        13000
    );

}


/* =========================================
   START EMOJIS
========================================= */

setInterval(
    createEmoji,
    900
);


/* =========================================
   OPEN LETTER
========================================= */

function openLetter() {

    const name =
        nameInput.value.trim();


    if (!name) {

        error.classList.add(
            "show"
        );

        nameInput.focus();

        return;
    }


    error.classList.remove(
        "show"
    );


    /*
       Encode name safely for URL
    */

    const encodedName =
        encodeURIComponent(
            name
        );


    /*
       Go to letter.html
    */

    window.location.href =
        "letter.html?name=" +
        encodedName;

}


/* =========================================
   BUTTON CLICK
========================================= */

openButton.addEventListener(
    "click",
    openLetter
);


/* =========================================
   ENTER KEY
========================================= */

nameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            openLetter();

        }

    }
);


/* =========================================
   REMOVE ERROR WHEN TYPING
========================================= */

nameInput.addEventListener(
    "input",
    function() {

        if (
            nameInput.value.trim()
        ) {

            error.classList.remove(
                "show"
            );

        }

    }
);

</script>

</body>

</html>
