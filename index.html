<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise For You</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">


<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,105,145,.23),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(170,90,255,.18),
            transparent 30%
        ),
        #100a12;

    color: white;

    font-family:
        "Poppins",
        sans-serif;
}


/* =========================
   BACKGROUND GLOW
========================= */

.glow {

    position: fixed;

    width: 400px;
    height: 400px;

    border-radius: 50%;

    filter: blur(100px);

    pointer-events: none;

    opacity: .7;
}

.glow.one {

    top: -180px;
    left: -150px;

    background:
        rgba(255,105,145,.15);
}

.glow.two {

    right: -180px;
    bottom: -180px;

    background:
        rgba(170,90,255,.13);
}


/* =========================
   FLOATING EMOJIS
========================= */

#emojiContainer {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;
}


.emoji {

    position: absolute;

    bottom: -60px;

    opacity: 0;

    animation:
        floatEmoji
        linear
        forwards;

    user-select: none;
}


@keyframes floatEmoji {

    0% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(.7);

        opacity: 0;
    }

    15% {
        opacity: .7;
    }

    100% {

        transform:
            translateY(-110vh)
            rotate(25deg)
            scale(1.1);

        opacity: 0;
    }
}


/* =========================
   MAIN
========================= */

main {

    position: relative;

    z-index: 2;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


/* =========================
   CARD
========================= */

.card {

    width:
        min(
            510px,
            100%
        );

    padding:
        45px 35px;

    text-align: center;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 28px;

    background:
        rgba(255,255,255,.055);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.45);

    animation:
        cardAppear
        .8s
        ease;
}


@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.96);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   ICON
========================= */

.icon {

    width: 75px;
    height: 75px;

    margin:
        0 auto 20px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 50%;

    background:
        rgba(255,143,171,.12);

    border:
        1px solid
        rgba(255,143,171,.25);

    font-size: 34px;

    animation:
        iconFloat
        2.5s
        ease-in-out
        infinite
        alternate;
}


@keyframes iconFloat {

    to {

        transform:
            translateY(-7px)
            rotate(3deg);
    }
}


/* =========================
   TITLE
========================= */

.small-title {

    font-size: 11px;

    letter-spacing: .25em;

    text-transform: uppercase;

    color:
        rgba(255,255,255,.55);

    margin-bottom: 12px;
}


h1 {

    font-family:
        "Caveat",
        cursive;

    font-size:
        clamp(
            55px,
            12vw,
            80px
        );

    line-height: .85;

    font-weight: 500;
}


h1 span {

    display: block;

    color: #ff8fab;

    font-style: italic;
}


.description {

    max-width: 390px;

    margin:
        25px auto 28px;

    color:
        rgba(255,255,255,.65);

    font-size: 14px;

    line-height: 1.7;
}


/* =========================
   INPUT
========================= */

.input-wrapper {

    width: 100%;
}


.input-wrapper input {

    width: 100%;

    height: 58px;

    padding:
        0 20px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 15px;

    outline: none;

    background:
        rgba(0,0,0,.2);

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 15px;

    text-align: center;

    transition: .3s;
}


.input-wrapper input::placeholder {

    color:
        rgba(255,255,255,.38);
}


.input-wrapper input:focus {

    border-color:
        rgba(255,143,171,.7);

    box-shadow:
        0 0 25px
        rgba(255,105,145,.12);
}


/* =========================
   GENERATE BUTTON
========================= */

.generate-button {

    width: 100%;

    height: 58px;

    margin-top: 14px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #ff8fab,
            #c83d67
        );

    color: white;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 12px 30px
        rgba(200,61,103,.3);

    transition: .25s;
}


.generate-button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 18px 40px
        rgba(200,61,103,.45);
}


/* =========================
   ERROR
========================= */

.error {

    min-height: 20px;

    margin-top: 7px;

    font-size: 12px;

    color: #ff8fab;

    opacity: 0;

    transition: .2s;
}


.error.show {
    opacity: 1;
}


/* =========================
   RESULT
========================= */

.result {

    display: none;

    margin-top: 25px;

    padding: 20px;

    border-radius: 18px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.1);

    animation:
        resultAppear
        .5s
        ease;
}


.result.show {
    display: block;
}


@keyframes resultAppear {

    from {

        opacity: 0;

        transform:
            translateY(15px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.result-title {

    font-size: 12px;

    color:
        rgba(255,255,255,.55);

    margin-bottom: 10px;
}


/* =========================
   GENERATED LINK
========================= */

.link-box {

    display: flex;

    gap: 8px;

    width: 100%;
}


#generatedLink {

    flex: 1;

    min-width: 0;

    height: 45px;

    padding:
        0 12px;

    border: none;

    outline: none;

    border-radius: 10px;

    background:
        rgba(0,0,0,.3);

    color: #ffb2c5;

    font-family:
        monospace;

    font-size: 11px;
}


.copy-button {

    width: 75px;

    border: none;

    border-radius: 10px;

    background:
        rgba(255,143,171,.15);

    border:
        1px solid
        rgba(255,143,171,.2);

    color: white;

    cursor: pointer;

    transition: .2s;
}


.copy-button:hover {

    background:
        rgba(255,143,171,.25);
}


/* =========================
   ACTION BUTTONS
========================= */

.actions {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 12px;
}


.action-button {

    height: 48px;

    border: none;

    border-radius: 12px;

    cursor: pointer;

    font-family:
        "Poppins",
        sans-serif;

    font-size: 13px;

    font-weight: 500;

    transition: .2s;
}


.open-button {

    background:
        #b83d62;

    color: white;
}


.share-button {

    background:
        rgba(255,255,255,.08);

    color: white;

    border:
        1px solid
        rgba(255,255,255,.12);
}


.action-button:hover {

    transform:
        translateY(-2px);
}


/* =========================
   BOTTOM
========================= */

.bottom-text {

    margin-top: 22px;

    color:
        rgba(255,255,255,.35);

    font-size: 11px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    main {
        padding: 15px;
    }

    .card {

        padding:
            38px 20px;

        border-radius: 24px;
    }

    .icon {

        width: 65px;
        height: 65px;

        font-size: 29px;
    }

    h1 {
        font-size: 58px;
    }

    .description {
        font-size: 13px;
    }

    .actions {
        grid-template-columns: 1fr;
    }

    .link-box {
        flex-direction: column;
    }

    #generatedLink {
        width: 100%;
    }

    .copy-button {
        width: 100%;
        height: 45px;
    }
}


@media (max-width: 360px) {

    .card {
        padding:
            30px 16px;
    }

    h1 {
        font-size: 50px;
    }
}

</style>

</head>


<body>


<!-- Background -->

<div class="glow one"></div>
<div class="glow two"></div>


<!-- Floating friendship emojis -->

<div id="emojiContainer"></div>



<main>

    <div class="card">


        <!-- Icon -->

        <div class="icon">
            🤝
        </div>


        <!-- Heading -->

        <div class="small-title">
            A little surprise
        </div>


        <h1>

            Something

            <span>
                For You
            </span>

        </h1>


        <p class="description">

            কিছু কথা সরাসরি বলা হয় না।
            তাই একটা ছোট্ট চিঠির মাধ্যমে
            কিছু কথা তোমার সাথে share করতে চাই।

        </p>



        <!-- Name -->

        <div class="input-wrapper">

            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name"
                maxlength="30"
                autocomplete="off"
            >

        </div>


        <div
            id="error"
            class="error"
        >

            Please enter your name.

        </div>



        <!-- Generate -->

        <button
            id="generateButton"
            class="generate-button"
        >

            Generate Your Letter Link →

        </button>



        <!-- Result -->

        <div
            id="result"
            class="result"
        >


            <div class="result-title">

                Your personalized link

            </div>


            <div class="link-box">


                <input
                    id="generatedLink"
                    type="text"
                    readonly
                >


                <button
                    id="copyButton"
                    class="copy-button"
                >

                    Copy

                </button>


            </div>


            <div class="actions">


                <button
                    id="openButton"
                    class="action-button open-button"
                >

                    Open Letter

                </button>


                <button
                    id="shareButton"
                    class="action-button share-button"
                >

                    WhatsApp Share

                </button>


            </div>


        </div>


        <p class="bottom-text">

            Made specially for a best friend ✨

        </p>


    </div>

</main>



<script>

/* =========================================
   ELEMENTS
========================================= */

const nameInput =
    document.getElementById(
        "nameInput"
    );


const generateButton =
    document.getElementById(
        "generateButton"
    );


const error =
    document.getElementById(
        "error"
    );


const result =
    document.getElementById(
        "result"
    );


const generatedLink =
    document.getElementById(
        "generatedLink"
    );


const copyButton =
    document.getElementById(
        "copyButton"
    );


const openButton =
    document.getElementById(
        "openButton"
    );


const shareButton =
    document.getElementById(
        "shareButton"
    );


const emojiContainer =
    document.getElementById(
        "emojiContainer"
    );



/* =========================================
   EMOJIS
========================================= */

const emojis = [

    "🤝",
    "⭐",
    "✨",
    "🌟",
    "🎉",
    "😊",
    "🌱",
    "🫶",
    "🎈"

];



/* =========================================
   FLOATING EMOJI
========================================= */

function createEmoji() {

    const emoji =
        document.createElement(
            "span"
        );


    emoji.className =
        "emoji";


    emoji.textContent =
        emojis[
            Math.floor(
                Math.random() *
                emojis.length
            )
        ];


    emoji.style.left =
        Math.random() * 100 + "%";


    emoji.style.fontSize =
        (
            15 +
            Math.random() * 18
        ) + "px";


    emoji.style.animationDuration =
        (
            6 +
            Math.random() * 6
        ) + "s";


    emojiContainer.appendChild(
        emoji
    );


    setTimeout(
        () => emoji.remove(),
        13000
    );
}


setInterval(
    createEmoji,
    900
);



/* =========================================
   GENERATE LINK
========================================= */

function generateLink() {

    const name =
        nameInput.value.trim();


    /* Empty name */

    if (!name) {

        error.classList.add(
            "show"
        );

        result.classList.remove(
            "show"
        );

        nameInput.focus();

        return;
    }


    error.classList.remove(
        "show"
    );


    /*
       Encode name so spaces
       and Bengali names work.
    */

    const encodedName =
        encodeURIComponent(
            name
        );


    /*
       Current GitHub Pages URL.

       Example:

       https://username.github.io/repository/

       Then:

       letter.html?name=Nayan
    */

    const baseURL =
        window.location.href
            .substring(
                0,
                window.location.href
                    .lastIndexOf("/") + 1
            );


    const finalURL =
        baseURL +
        "letter.html?name=" +
        encodedName;


    generatedLink.value =
        finalURL;


    result.classList.add(
        "show"
    );


    /*
       Scroll result into view
    */

    setTimeout(
        function() {

            result.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        },
        100
    );

}



/* =========================================
   GENERATE BUTTON
========================================= */

generateButton.addEventListener(
    "click",
    generateLink
);



/* =========================================
   ENTER KEY
========================================= */

nameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            generateLink();

        }

    }
);



/* =========================================
   REMOVE ERROR
========================================= */

nameInput.addEventListener(
    "input",
    function() {

        if (
            nameInput.value.trim()
        ) {

            error.classList.remove(
                "show"
            );

        }

    }
);



/* =========================================
   COPY LINK
========================================= */

copyButton.addEventListener(
    "click",
    async function() {

        const link =
            generatedLink.value;


        if (!link) {
            return;
        }


        try {

            await navigator.clipboard.writeText(
                link
            );

            copyButton.textContent =
                "Copied ✓";


            setTimeout(
                function() {

                    copyButton.textContent =
                        "Copy";

                },
                1800
            );


        } catch (error) {

            generatedLink.select();

            document.execCommand(
                "copy"
            );

            copyButton.textContent =
                "Copied ✓";


            setTimeout(
                function() {

                    copyButton.textContent =
                        "Copy";

                },
                1800
            );

        }

    }
);



/* =========================================
   OPEN LETTER
========================================= */

openButton.addEventListener(
    "click",
    function() {

        const link =
            generatedLink.value;


        if (link) {

            window.location.href =
                link;

        }

    }
);



/* =========================================
   WHATSAPP SHARE
========================================= */

shareButton.addEventListener(
    "click",
    function() {

        const link =
            generatedLink.value;


        if (!link) {
            return;
        }


        const message =
            "I made a little surprise for you ✨\n\n" +
            link;


        const whatsappURL =
            "https://wa.me/?text=" +
            encodeURIComponent(
                message
            );


        window.open(
            whatsappURL,
            "_blank"
        );

    }
);

</script>

</body>

</html>
